name: Monitor The Odyssey

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      test_bark:
        description: "Send a Bark test notification to the iPhone"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: movie-odyssey-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Check Maoyan
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_BARK: ${{ inputs.test_bark }}
        run: |
          python monitor.py

      - name: Save state
        if: ${{ inputs.test_bark != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update movie showtime state"
            git pull --rebase origin main
            git push origin main
          fi
